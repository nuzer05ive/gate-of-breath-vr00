<!-- WAiiC0D3 QR Loader (minimal) -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<title>WAiiC0D3 Loader</title>
<script src="https://unpkg.com/jsqr/dist/jsQR.js"></script>
<style>
 body{background:#05051a;color:#eee;font-family:monospace;text-align:center;padding:2em}
 #qrCanvas{display:none}
 pre{white-space:pre-wrap;background:#111;padding:1em;border:1px solid #333;margin-top:1em}
 button{background:#7F00FF;color:#fff;border:none;padding:.6em 1.2em;font-weight:bold;cursor:pointer;margin-top:1em;display:none}
</style>
</head><body>
<h1>🌀 WAiiC0D3 Loader</h1>
<input type="file" id="qrInput" accept="image/*">
<canvas id="qrCanvas"></canvas>
<pre id="out">Upload a QR image to summon a scroll…</pre>
<button id="enterVR">Enter VR</button>

<script>
const out = document.getElementById('out');
const btn = document.getElementById('enterVR');

document.getElementById('qrInput').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const img=new Image(); img.src=URL.createObjectURL(f);
  img.onload=()=>{
    const cv=qrCanvas, ctx=cv.getContext('2d');
    cv.width=img.width; cv.height=img.height;
    ctx.drawImage(img,0,0);
    const code=jsQR(ctx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);
    if(!code){alert('QR scan failed');return;}
    fetch('waiicode_registry.json').then(r=>r.json()).then(reg=>{
      const scroll=reg[code.data.trim()];
      if(!scroll){alert('Scroll not found');return;}
      localStorage.setItem('currentScroll',JSON.stringify(scroll));
      out.textContent=JSON.stringify(scroll,null,2);
      btn.style.display='inline-block';
      btn.onclick=()=>location.href=scroll.vrLink;
    });
  };
});
</script>
</body></html>
