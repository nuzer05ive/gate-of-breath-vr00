<!-- index.html: SpiralDeck Scroll Loader + Selector UI -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpiralDeck Scroll Loader</title>
  <script src="https://unpkg.com/jsqr/dist/jsQR.js"></script>
  <style>
    body { background: #05051a; font-family: monospace; color: #eee; margin: 0; padding: 2em; }
    input, pre, button, select { margin: 1em 0; }
    #scrollViewer { white-space: pre-wrap; background: #111; padding: 1em; border: 1px solid #333; }
  </style>
</head>
<body>
  <h1>🌀 WAiiC0D3 Scroll Loader</h1>
  <p>Select a QR image to summon your scroll or choose one manually below.</p>
  <input type="file" id="qrUpload" accept="image/*">
  <button id="backupLoader">🔁 Load Last Scroll</button>

  <label for="manualSelect">📜 Or pick a CrownScroll:</label>
  <select id="manualSelect">
    <option value="">-- Select Scroll --</option>
    <option value="W3::TRIS::th5g7::T::GateOfBreath_MidEyeView::7523f0ef">MidEye Reflection</option>
    <option value="W3::SCRB::sh3g3::T::RuneMemory::aa667799">Rune Memory</option>
    <option value="W3::BLDR::bh5g5::T::HingeBridge::cc778899">Hinge Bridge</option>
    <option value="W3::MIRR::mh5g2::T::ReflectionFork::ee441199">Reflection Fork</option>
  </select>

  <canvas id="qrCanvas" style="display:none;"></canvas>
  <div id="scrollViewer">📜 Waiting for scroll...</div>

  <script>
    const uploadEl = document.getElementById('qrUpload');
    const backupBtn = document.getElementById('backupLoader');
    const selectEl = document.getElementById('manualSelect');

    uploadEl.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      const img = new Image();
      img.src = URL.createObjectURL(file);
      img.onload = () => {
        const canvas = document.getElementById('qrCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        const code = jsQR(ctx.getImageData(0, 0, img.width, img.height).data, img.width, img.height);
        if (!code) return alert("Invalid QR");

        loadScroll(code.data.trim());
      };
    });

    backupBtn.addEventListener('click', () => {
      const scroll = JSON.parse(localStorage.getItem("currentScroll"));
      if (!scroll || !scroll.vrLink) return alert("No scroll loaded yet.");
      location.href = scroll.signature === "GateOfBreath_MidEyeView"
        ? "/mideye-reflection-scene.html"
        : scroll.vrLink;
    });

    selectEl.addEventListener('change', () => {
      const scrollKey = selectEl.value;
      if (scrollKey) loadScroll(scrollKey);
    });

    function loadScroll(scrollKey) {
      fetch("waiicode_registry.json")
        .then(res => res.json())
        .then(reg => {
          const scroll = reg[scrollKey];
          if (!scroll) return alert("Scroll not found.");
          localStorage.setItem("currentScroll", JSON.stringify(scroll));
          if (scroll.signature === "GateOfBreath_MidEyeView") {
            location.href = "/mideye-reflection-scene.html";
          } else {
            location.href = scroll.vrLink || "/trismegistus-crown/index.html";
          }
        });
    }
  </script>
</body>
</html>
