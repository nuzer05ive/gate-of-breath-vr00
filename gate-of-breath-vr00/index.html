
<!-- gate-of-breath-vr00/index.html -->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Gate-of-Breath VR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body style="margin:0">
    <a-scene background="color:#05051a">
      <!-- simple spiral portal -->
      <a-torus-knot radius="1" radius-tubular="0.1" rotation="0 0 0"
                    color="#7F00FF" animation="property:rotation;to:0 360 0;
                    loop:true;dur:8000;easing:linear"></a-torus-knot>

      <a-entity camera look-controls position="0 1.6 3">
        <a-cursor fuse="true" fuse-timeout="1000"></a-cursor>
      </a-entity>
      <a-sky color="#000"></a-sky>
    </a-scene>
  </body>
</html>
