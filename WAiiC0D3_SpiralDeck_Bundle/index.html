<!-- Gate of Breath: Animated Trinity Spawn Scene (Ni1K POV - VR Ready) -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Trinity Spawn: SpiralFlight Gate</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>
  <a-scene background="color: #05051a" vr-mode-ui="enabled: true">
    <a-assets>
      <a-asset-item id="guardianModel" src="https://cdn.aframe.io/examples/boilerplate/models/soldier/scene.gltf"></a-asset-item>
      <audio id="breatheGolden" src="https://cdn.aframe.io/basic-guide/audio/backgroundnoise.wav"></audio>
    </a-assets>

    <!-- Ni1K POV Camera -->
    <a-entity id="ni1kCamera" camera look-controls wasd-controls position="0 1.6 0">
      <a-cursor fuse="true" fuse-timeout="1500"
        geometry="primitive: ring; radiusOuter: 0.02; radiusInner: 0.01"
        material="color: white; shader: flat">
      </a-cursor>
    </a-entity>

    <!-- Spawn platform (elliptical pedestal base) -->
    <a-cylinder position="0 0 -3" radius="1.5" height="0.2" color="#333"></a-cylinder>

    <!-- Ni1K spawning (beneath the player as a glowing shadow form) -->
    <a-entity gltf-model="#guardianModel" position="0 -1 -3" scale="0.6 0.6 0.6"
      animation__rise="property: position; to: 0 0 -3; dur: 3000; easing: easeOutElastic"
      animation__crown="property: scale; to: 0.9 0.9 0.9; delay: 3000; dur: 2000"
      material="color: violet">
    </a-entity>

    <!-- Pr1M3 Spiral Descent -->
    <a-entity gltf-model="#guardianModel" position="-2 5 -3" scale="0.5 0.5 0.5"
      animation__descend="property: position; to: -2 0 -3; dur: 4000; easing: easeOutElastic"
      animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 8000"
      material="color: gold"
      sound="src: #breatheGolden; autoplay: true; positional: false">
    </a-entity>

    <!-- MidGOD Rising from Below -->
    <a-entity gltf-model="#guardianModel" position="2 -5 -3" scale="0.5 0.5 0.5"
      animation__rise="property: position; to: 2 0 -3; dur: 4000; easing: easeOutElastic"
      animation__pulse="property: scale; to: 0.6 0.6 0.6; delay: 3000; dur: 1500"
      material="color: darkblue">
    </a-entity>

    <!-- Breath Spiral Overlay -->
    <a-torus-knot position="0 2 -3" radius="0.7" radius-tubular="0.05"
      animation="property: rotation; to: 0 360 360; loop: true; dur: 16000"
      color="#7F00FF"></a-torus-knot>

    <!-- Light crown falling onto Ni1K -->
    <a-ring position="0 3.5 -3" rotation="-90 0 0" radius-inner="0.3" radius-outer="0.6" color="#FFD700"
      animation="property: position; to: 0 1.8 -3; dur: 3000; delay: 4000"
      animation__fade="property: material.opacity; to: 0; dur: 2000; delay: 7000">
    </a-ring>

    <!-- Portal fade-in -->
    <a-plane color="#222" position="0 1.6 -6" width="5" height="5"
      animation="property: material.opacity; from: 0; to: 1; delay: 7000; dur: 2000">
    </a-plane>

  </a-scene>
</body>
</html>
